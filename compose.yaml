services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-delivery_glance}
      POSTGRES_USER: ${POSTGRES_USER:-delivery_glance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-delivery_glance}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-delivery_glance} -d ${POSTGRES_DB:-delivery_glance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Passed through literally, so a bcrypt hash's '$' characters survive; see .env.example.
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-delivery_glance}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-delivery_glance}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-delivery_glance}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Unlike the two above, tracking defaults to secure in the application. The local demo is the
      # exception that has to say so, which is the right way round for a public bearer link.
      TRACKING_COOKIE_SECURE: ${TRACKING_COOKIE_SECURE:-false}
      TRACKING_KEY_V1: ${TRACKING_KEY_V1:-development-only-tracking-key-do-not-deploy}
      # Unset by default, and the demo works that way: the Recipient view keeps its status and
      # freshness content and says the map is unavailable. Set it to see the map itself.
      TRACKING_MAP_STYLE_URL: ${TRACKING_MAP_STYLE_URL:-}
      DELIVERY_TEAM_CONTACT: ${DELIVERY_TEAM_CONTACT:-}
      # Only used the first time Flyway runs against an empty database; see .env.example.
      DEMO_DISPATCHER_EMAIL: ${DEMO_DISPATCHER_EMAIL:-dispatcher@delivery-glance.example}
      DEMO_DISPATCHER_DISPLAY_NAME: ${DEMO_DISPATCHER_DISPLAY_NAME:-Dana the Dispatcher}
      DEMO_COURIER_EMAIL: ${DEMO_COURIER_EMAIL:-courier@delivery-glance.example}
      DEMO_COURIER_DISPLAY_NAME: ${DEMO_COURIER_DISPLAY_NAME:-Cory the Courier}

volumes:
  postgres-data:
