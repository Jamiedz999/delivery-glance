name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs below are the Core build contract from
# docs/planning/implementation/TECHNICAL-BASELINE.md, run from a clean checkout. What each of them
# is evidence for is written down in docs/testing.md.

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: server/pom.xml
      - name: Verify
        working-directory: server
        run: ./mvnw --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend (npm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      # The baseline defines `check` as type checking, unit tests and a production build, so
      # linting stays a separate step rather than being folded into it. Formatting is a third
      # step for the same reason: a failure should name itself rather than arrive as "check".
      - name: Format
        working-directory: web
        run: npm run format:check
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Check
        working-directory: web
        run: npm run check

  packaging:
    name: Packaging (Compose)
    runs-on: ubuntu-latest
    # The image build plus a first-run Flyway migration against real PostgreSQL; well under this
    # in practice, but a hung healthcheck should fail the job rather than the workflow timeout.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start the application image and PostgreSQL
        run: docker compose up --build --wait
      - name: Check the application answers
        run: |
          curl --fail --silent http://localhost:8080/actuator/health
          curl --fail --silent http://localhost:8080/api/system
      - name: Show the application log on failure
        if: failure()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down

  journeys:
    name: Journeys (Playwright)
    runs-on: ubuntu-latest
    # Two cross-role walkthroughs plus the accessibility checks, against the same image the
    # packaging job builds. One restarts the application on purpose, which is what severs a live
    # stream; the timeout is generous enough for that and short enough to fail a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Start the application image and PostgreSQL
        # The map style is a release input, and the journeys serve their own so that the Courier's
        # marker actually exists to be removed. See web/e2e/support/mapStyle.ts.
        env:
          TRACKING_MAP_STYLE_URL: http://127.0.0.1:9099/style.json
        run: docker compose up --build --wait
      - name: Run the journeys
        working-directory: web
        run: npm run e2e
      - name: Show the application log on failure
        if: failure()
        run: docker compose logs app
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 14
      - name: Stop
        if: always()
        run: docker compose down
