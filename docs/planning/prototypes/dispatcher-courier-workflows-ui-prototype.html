<!doctype html>
<!-- Three variants of the Dispatcher and Courier workspaces, switchable via ?variant= on this standalone throwaway prototype route. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow,nosnippet" />
    <title>Delivery Glance — Full-product operations workflow prototype</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #17241f;
        --muted: #607069;
        --line: #dce4df;
        --canvas: #edf1ed;
        --paper: #fffefa;
        --paper-2: #f7f8f4;
        --green: #176b4d;
        --green-2: #0d4c37;
        --green-soft: #e0f3e9;
        --amber: #945a08;
        --amber-soft: #fff0cf;
        --red: #9f342c;
        --red-soft: #fae3df;
        --blue: #315f8d;
        --blue-soft: #e5eff9;
        --violet: #6555a3;
        --violet-soft: #eeeafa;
        --shadow: 0 18px 60px rgba(23, 36, 31, 0.13);
        --shadow-soft: 0 8px 26px rgba(23, 36, 31, 0.09);
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; background: var(--canvas); }
      body {
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 3px solid #0b6cff;
        outline-offset: 3px;
      }
      h1, h2, h3, p { margin-top: 0; }
      a { color: inherit; }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .prototype-ribbon {
        position: fixed;
        z-index: 95;
        top: 12px;
        right: 12px;
        padding: 7px 10px;
        border: 1px solid rgba(23, 36, 31, 0.18);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.94);
        color: #405149;
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        backdrop-filter: blur(10px);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: inherit;
        font-size: 15px;
        font-weight: 820;
        letter-spacing: -0.02em;
        white-space: nowrap;
      }
      .brand-mark {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        border-radius: 11px 11px 11px 3px;
        background: var(--ink);
        color: #fff;
        font-size: 13px;
        letter-spacing: -0.04em;
      }
      .eyebrow {
        margin: 0 0 7px;
        color: var(--muted);
        font-size: 10px;
        font-weight: 850;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }
      .subtle { color: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .badge {
        display: inline-flex;
        min-height: 27px;
        align-items: center;
        gap: 7px;
        padding: 5px 9px;
        border-radius: 999px;
        background: #edf1ee;
        color: #43534c;
        font-size: 10px;
        font-weight: 820;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .badge::before {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        content: "";
      }
      .badge.good { background: var(--green-soft); color: var(--green); }
      .badge.warn { background: var(--amber-soft); color: var(--amber); }
      .badge.bad { background: var(--red-soft); color: var(--red); }
      .badge.info { background: var(--blue-soft); color: var(--blue); }
      .badge.violet { background: var(--violet-soft); color: var(--violet); }
      .badge.neutral::before { background: #7a8881; }
      .button {
        display: inline-flex;
        min-height: 40px;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 9px 14px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--ink);
        color: #fff;
        font-weight: 760;
        line-height: 1.1;
        text-decoration: none;
      }
      .button:hover { filter: brightness(1.06); }
      .button.secondary { border-color: var(--line); background: #fff; color: var(--ink); }
      .button.ghost { background: transparent; color: var(--ink); }
      .button.good { background: var(--green); }
      .button.warn { border-color: #e8bd72; background: var(--amber-soft); color: #734609; }
      .button.danger { border-color: #e8aaa4; background: #fff; color: var(--red); }
      .button.small { min-height: 34px; padding: 7px 10px; border-radius: 8px; font-size: 12px; }
      .button:disabled { cursor: not-allowed; opacity: 0.48; }
      .button-row { display: flex; flex-wrap: wrap; gap: 9px; }
      .divider { height: 1px; margin: 18px 0; background: var(--line); }
      .field { display: grid; gap: 6px; }
      .field label { color: var(--muted); font-size: 11px; font-weight: 750; }
      .field input, .field select, .field textarea, .search-input {
        width: 100%;
        min-height: 42px;
        border: 1px solid #cfd8d2;
        border-radius: 9px;
        background: #fff;
        color: var(--ink);
        padding: 9px 11px;
      }
      .field textarea { min-height: 82px; resize: vertical; }
      .field-grid { display: grid; gap: 13px; }
      .notice {
        padding: 12px 13px;
        border: 1px solid #ecd099;
        border-radius: 10px;
        background: #fff8e8;
        color: #65460f;
        font-size: 12px;
        line-height: 1.45;
      }
      .notice.bad { border-color: #e8aaa4; background: #fff3f1; color: #7e2b25; }
      .notice.good { border-color: #a8d4bc; background: #edf9f2; color: #155b42; }
      .mini-label { color: var(--muted); font-size: 10px; font-weight: 820; letter-spacing: 0.08em; text-transform: uppercase; }
      .stat-value { display: block; margin-top: 4px; font-size: 19px; font-weight: 820; letter-spacing: -0.035em; }

      /* Variant A — role-specific master/detail workspaces */
      .a-dispatch {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 178px minmax(250px, 310px) minmax(560px, 1fr);
        background: #eef1ed;
      }
      .a-nav {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        padding: 24px 15px 110px;
        background: #183129;
        color: #f5fbf7;
      }
      .a-nav .brand-mark { background: #f1f8f3; color: #173027; }
      .a-nav-section { margin-top: 34px; }
      .a-nav-link {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-bottom: 4px;
        padding: 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: #bdd0c6;
        text-align: left;
        font-size: 12px;
        font-weight: 700;
      }
      .a-nav-link.active { background: rgba(255,255,255,0.12); color: #fff; }
      .a-nav-link .nav-icon { width: 18px; text-align: center; }
      .a-account { margin-top: auto; color: #bdd0c6; font-size: 11px; line-height: 1.5; }
      .a-account strong { display: block; color: #fff; font-size: 12px; }
      .a-index {
        min-height: 100vh;
        border-right: 1px solid var(--line);
        background: #f9faf7;
        padding: 24px 14px 112px;
      }
      .a-index-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
      .a-index h1 { margin: 0; font-size: 22px; letter-spacing: -0.04em; }
      .a-search { margin: 16px 0 10px; }
      .a-filter-row { display: flex; gap: 7px; margin-bottom: 14px; overflow-x: auto; }
      .filter-chip {
        padding: 6px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fff;
        color: var(--muted);
        font-size: 10px;
        font-weight: 750;
        white-space: nowrap;
      }
      .filter-chip.active { border-color: var(--ink); background: var(--ink); color: #fff; }
      .delivery-row {
        width: 100%;
        margin-bottom: 7px;
        padding: 12px;
        border: 1px solid transparent;
        border-radius: 11px;
        background: transparent;
        color: inherit;
        text-align: left;
      }
      .delivery-row:hover { background: #fff; }
      .delivery-row.selected { border-color: #cbd8d0; background: #fff; box-shadow: var(--shadow-soft); }
      .delivery-row-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .delivery-row strong { font-size: 12px; }
      .delivery-row p { margin: 7px 0 0; color: var(--muted); font-size: 11px; line-height: 1.35; }
      .tiny-state { color: var(--green); font-size: 9px; font-weight: 850; letter-spacing: 0.05em; text-transform: uppercase; }
      .tiny-state.warn { color: var(--amber); }
      .tiny-state.neutral { color: #68766f; }
      .a-record { min-width: 0; padding: 26px clamp(22px, 4vw, 58px) 126px; }
      .a-record-shell { max-width: 1050px; margin: 0 auto; }
      .a-record-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
      .a-record-head h1 { margin: 3px 0 7px; font-size: clamp(30px, 3vw, 43px); letter-spacing: -0.055em; }
      .a-record-head p { margin-bottom: 0; color: var(--muted); font-size: 13px; }
      .a-record-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(245px, 0.75fr); gap: 18px; margin-top: 24px; }
      .a-card {
        padding: 19px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: var(--paper);
        box-shadow: 0 2px 10px rgba(23,36,31,0.03);
      }
      .a-card + .a-card { margin-top: 14px; }
      .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
      .card-head h2 { margin: 0; font-size: 16px; letter-spacing: -0.025em; }
      .card-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .address-pair { position: relative; display: grid; gap: 17px; padding-left: 23px; }
      .address-pair::before { position: absolute; top: 8px; bottom: 9px; left: 6px; width: 1px; background: #b9c8bf; content: ""; }
      .address-point { position: relative; }
      .address-point::before {
        position: absolute;
        top: 5px;
        left: -22px;
        width: 11px;
        height: 11px;
        border: 3px solid #fff;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 1px #9fb2a7;
        content: "";
      }
      .address-point:last-child::before { border-radius: 50% 50% 50% 2px; background: var(--ink); transform: rotate(-45deg); }
      .address-point strong { display: block; margin-top: 4px; font-size: 12px; line-height: 1.4; }
      .candidate-table { width: 100%; border-collapse: collapse; font-size: 11px; }
      .candidate-table th { padding: 7px 8px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 9px; letter-spacing: 0.07em; text-align: left; text-transform: uppercase; }
      .candidate-table td { padding: 10px 8px; border-bottom: 1px solid #e8ede9; vertical-align: middle; }
      .candidate-table tr:last-child td { border-bottom: 0; }
      .candidate-rank { width: 27px; color: var(--muted); font-weight: 850; }
      .candidate-name { font-weight: 780; }
      .candidate-meta { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; }
      .response-list { display: grid; gap: 8px; }
      .response-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
      .response-row strong { display: block; font-size: 11px; }
      .response-row span { color: var(--muted); font-size: 10px; }
      .countdown { color: var(--green); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 21px; font-weight: 850; letter-spacing: -0.05em; }
      .side-action { position: sticky; top: 22px; }
      .next-card { padding: 20px; border-radius: 14px; background: #183129; color: #fff; box-shadow: var(--shadow); }
      .next-card .eyebrow { color: #afc8bb; }
      .next-card h2 { margin-bottom: 9px; font-size: 22px; letter-spacing: -0.04em; }
      .next-card p { color: #c9d9d0; font-size: 12px; line-height: 1.5; }
      .next-card .button.secondary { border-color: rgba(255,255,255,0.3); background: transparent; color: #fff; }
      .fact-list { display: grid; gap: 12px; }
      .fact { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding-bottom: 11px; border-bottom: 1px solid var(--line); }
      .fact:last-child { padding-bottom: 0; border: 0; }
      .fact span { color: var(--muted); font-size: 10px; }
      .fact strong { font-size: 11px; text-align: right; }
      .timeline { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
      .timeline li { position: relative; display: grid; grid-template-columns: 13px 1fr auto; gap: 9px; color: var(--muted); font-size: 11px; }
      .timeline-dot { width: 9px; height: 9px; margin-top: 2px; border: 2px solid #aebbb4; border-radius: 50%; background: #fff; }
      .timeline li.done { color: var(--ink); }
      .timeline li.done .timeline-dot { border-color: var(--green); background: var(--green); }
      .timeline time { font-variant-numeric: tabular-nums; }

      .a-courier-canvas { min-height: 100vh; padding: 40px 18px 126px; background: radial-gradient(circle at 20% 0%, #d9ebe0 0, transparent 32%), #e9eee9; }
      .a-phone { width: min(100%, 430px); min-height: 720px; margin: 0 auto; overflow: hidden; border: 1px solid #ced8d1; border-radius: 28px; background: var(--paper); box-shadow: var(--shadow); }
      .a-phone-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px 19px 14px; }
      .avatar { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 50%; background: #e2eae5; color: #29453a; font-size: 11px; font-weight: 850; }
      .courier-control-strip { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; padding: 0 16px 14px; }
      .courier-control {
        min-height: 62px;
        padding: 11px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        text-align: left;
      }
      .courier-control strong { display: block; margin-top: 5px; font-size: 12px; }
      .courier-control.good { border-color: #afd3bf; background: #eef8f2; }
      .courier-control.warn { border-color: #e9cd93; background: #fff9ed; }
      .a-phone-main { padding: 6px 16px 88px; }
      .courier-hero { padding: 22px; border-radius: 16px; background: #19332a; color: #fff; }
      .courier-hero .eyebrow { color: #abc6b8; }
      .courier-hero h1 { margin-bottom: 9px; font-size: 29px; letter-spacing: -0.05em; line-height: 1.02; }
      .courier-hero p { margin-bottom: 17px; color: #c9d9d0; font-size: 13px; line-height: 1.5; }
      .courier-hero .button.secondary { border-color: rgba(255,255,255,0.35); background: transparent; color: #fff; }
      .phone-card { margin-top: 12px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
      .phone-card h2 { margin-bottom: 5px; font-size: 15px; }
      .phone-card p { margin-bottom: 12px; color: var(--muted); font-size: 11px; line-height: 1.45; }
      .phone-route { display: grid; gap: 10px; margin: 13px 0; }
      .phone-route div { padding-left: 13px; border-left: 3px solid #b8c9bf; }
      .phone-route div:last-child { border-color: var(--ink); }
      .phone-route span { display: block; color: var(--muted); font-size: 9px; font-weight: 820; text-transform: uppercase; }
      .phone-route strong { display: block; margin-top: 3px; font-size: 11px; line-height: 1.35; }
      .phone-nav { position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(2, 1fr); border-top: 1px solid var(--line); background: rgba(255,254,250,0.96); backdrop-filter: blur(12px); }
      .phone-nav button { padding: 13px; border: 0; background: transparent; color: var(--muted); font-size: 10px; font-weight: 750; }
      .phone-nav button.active { color: var(--green); }

      /* Variant B — visual operations board and Delivery deck */
      .b-dispatch { min-height: 100vh; padding: 22px 22px 128px; background: #f3efe7; }
      .b-topbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; max-width: 1500px; margin: 0 auto 18px; }
      .b-topbar-actions { display: flex; align-items: center; gap: 9px; }
      .b-board { display: grid; max-width: 1500px; margin: 0 auto; grid-template-columns: repeat(4, minmax(190px, 1fr)) minmax(330px, 1.25fr); gap: 11px; align-items: start; }
      .board-column { min-height: 620px; padding: 12px; border: 1px solid #ddd8cd; border-radius: 15px; background: rgba(255,255,255,0.5); }
      .board-column-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .board-column-head h2 { margin: 0; font-size: 12px; letter-spacing: -0.01em; }
      .board-count { display: grid; min-width: 24px; height: 24px; place-items: center; border-radius: 999px; background: #ebe6dc; color: #6a655c; font-size: 10px; font-weight: 800; }
      .board-card { margin-bottom: 9px; padding: 12px; border: 1px solid #ddd8cf; border-radius: 11px; background: #fffefa; box-shadow: 0 3px 10px rgba(50,42,28,0.04); }
      .board-card.selected { border: 2px solid #1d5e47; box-shadow: 0 8px 24px rgba(27,75,57,0.12); }
      .board-card strong { display: block; font-size: 11px; }
      .board-card p { margin: 7px 0 9px; color: #6d6961; font-size: 10px; line-height: 1.4; }
      .board-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: #7b766e; font-size: 9px; }
      .b-drawer { min-height: 620px; padding: 18px; border-radius: 15px; background: #1d2d27; color: #fff; box-shadow: var(--shadow); }
      .b-drawer .eyebrow { color: #afc2b8; }
      .b-drawer h1 { margin-bottom: 8px; font-size: 28px; letter-spacing: -0.05em; }
      .b-drawer > p { color: #bfd0c7; font-size: 11px; line-height: 1.5; }
      .b-drawer-section { margin-top: 14px; padding: 14px; border-radius: 11px; background: rgba(255,255,255,0.08); }
      .b-drawer-section h2 { margin-bottom: 10px; font-size: 13px; }
      .b-drawer .response-row { border-color: rgba(255,255,255,0.13); background: rgba(255,255,255,0.06); }
      .b-drawer .response-row span { color: #c0d0c7; }
      .b-drawer .button.secondary { border-color: rgba(255,255,255,0.25); background: transparent; color: #fff; }
      .b-drawer .fact { border-color: rgba(255,255,255,0.13); }
      .b-drawer .fact span { color: #abc0b5; }

      .b-courier-canvas { min-height: 100vh; padding: 54px 18px 130px; background: linear-gradient(155deg, #1d352c 0 36%, #e8e3d8 36%); }
      .b-courier { width: min(100%, 450px); margin: 0 auto; }
      .b-status-float { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 26px; color: #fff; }
      .b-status-float .brand-mark { background: #fff; color: #193129; }
      .b-status-pills { display: flex; gap: 7px; }
      .b-status-pills .badge { border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.12); color: #fff; }
      .deck-wrap { position: relative; min-height: 520px; }
      .deck-ghost { position: absolute; inset: 22px 13px auto; height: 460px; border-radius: 22px; background: #d7d1c5; transform: rotate(3deg); }
      .deck-ghost.two { inset: 12px 8px auto; background: #eee9df; transform: rotate(-2deg); }
      .task-deck { position: relative; min-height: 500px; padding: 22px; border-radius: 22px; background: #fffefa; box-shadow: var(--shadow); }
      .deck-timer { display: inline-grid; min-width: 66px; min-height: 66px; place-items: center; border: 6px solid #e0eee6; border-radius: 50%; color: var(--green); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17px; font-weight: 850; }
      .deck-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .task-deck h1 { margin: 21px 0 9px; font-size: 34px; letter-spacing: -0.055em; line-height: 1; }
      .task-deck > p { color: var(--muted); font-size: 13px; line-height: 1.5; }
      .deck-action-grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 9px; margin-top: 19px; }
      .deck-action-grid .button { min-height: 52px; }
      .ranking-note { margin-top: 14px; padding: 11px; border-radius: 9px; background: var(--blue-soft); color: #294f75; font-size: 10px; line-height: 1.45; }
      .deck-dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
      .deck-dots span { width: 6px; height: 6px; border-radius: 50%; background: #b8b3aa; }
      .deck-dots span.active { width: 18px; border-radius: 99px; background: var(--green); }

      /* Variant C — action path / guided checklist */
      .c-dispatch { min-height: 100vh; padding: 24px 24px 130px; background: #101714; color: #eef5f1; }
      .c-top { display: flex; max-width: 1400px; margin: 0 auto 22px; align-items: center; justify-content: space-between; gap: 18px; }
      .c-top .brand-mark { background: #e7f4eb; color: #13271f; }
      .c-top-meta { color: #85978e; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
      .c-console { display: grid; max-width: 1400px; margin: 0 auto; grid-template-columns: 230px minmax(420px, 1fr) 330px; gap: 1px; overflow: hidden; border: 1px solid #2a3731; border-radius: 12px; background: #2a3731; }

      .prototype-controls {
        position: fixed;
        z-index: 100;
        right: 12px;
        bottom: 12px;
        left: 12px;

        width: fit-content;

        min-height: 48px;
        margin: auto;
        align-items: center;
        gap: 7px;
        padding: 7px;
        border: 1px solid rgba(255,255,255,0.18);

        top: 18px;

v><div class="evidence-block"><h3>Ranking</h3><div class="evidence-row"><span>Calculated</span><strong>' + escapeHtml(state.recommendation.calculatedAt) + '</strong></div><div class="evidence-row"><span>Shortlist</span><strong>' + state.recommendation.candidates.length + ' eligible</strong></div></div>' + roleButton("Open Courier path", "courier") + '</aside></section></main>';

        function modalMarkup() {

        function render() {

          else if (variantKey === "C") renderer = role === "courier" ? renderCourierC : renderDispatcherC;
          else renderer = role === "courier" ? renderCourierA : renderDispatcherA;
          document.getElementById("app").innerHTML = renderer(state) + modalMarkup();

          document.getElementById("variant-label").textContent = variant.key + " — " + variant.name;
          document.getElementById("role-select").value = role;

        function renderToast(message) {

          toast.textContent = message;

          toastTimer = setTimeout(function () { ui.toast = null; if (toast.parentNode) toast.remove(); }, 2200);
        }
        function notify(message) { ui.toast = message; render(); }
        function changeStage(stage, message) { ui.panel = null; setQuery({ stage: stage }); if (message) { ui.toast = message; render(); } }
        function cycleVariant(direction) {
          var index = variants.findIndex(function (item) { return item.key === currentVariant(); });
          setQuery({ variant: variants[(index + direction + variants.length) % variants.length].key });

        function handleAction(action, element) {

          else if (action === "show_cancel_round") ui.panel = "cancel_round";

          else if (action === "show_undeliverable") ui.panel = "undeliverable";
          else if (action === "show_delivered") ui.panel = "delivered";

          else if (action === "create_delivery") return changeStage("awaiting_recommendation", "Delivery created in Awaiting Courier");
          else if (action === "go_on_duty") {
            ui.onDutyOverride = true;
            if (currentStage() === "courier_off_duty") return changeStage("courier_needs_location", "On Duty · still ineligible until Location Sharing starts");
            return notify("On Duty · the current Delivery and sharing state are unchanged");
          }
          else if (action === "go_off_duty") {
            var beforeDutyChange = buildState(currentStage());

            if (!beforeDutyChange.courier.activeDelivery && beforeDutyChange.delivery.state === "AWAITING_COURIER" && !beforeDutyChange.round) return changeStage("courier_off_duty", "Off Duty · Location Sharing stopped because no Active Delivery remains");
            return notify(beforeDutyChange.courier.activeDelivery ? "Off Duty · the Active Delivery and Location Sharing continue" : "Off Duty · Location Sharing stopped because no Active Delivery remains");
          }

          else if (action === "start_round") return changeStage("matching_round", "Matching Round started for the confirmed top three");
          else if (action === "match") return changeStage("interest_registered", "Match Interest registered · selection still waits for round close");

          else if (action === "withdraw_interest") return changeStage("matching_round", "Interest withdrawn without a penalty");
          else if (action === "close_round") {
            var closingState = buildState(currentStage());
            if (!closingState.courier.interest || !closingState.courier.onDuty || closingState.courier.sharing !== "REPORTING") return changeStage("no_match", "Round closed with no eligible interested Courier");
            return changeStage("assigned", "Maya selected atomically as the highest-ranked eligible interested Courier");
          }
          else if (action === "confirm_cancel_round") return changeStage("round_cancelled", "Round cancelled · Interests released without declines");
          else if (action === "confirm_reassign") { ui.reassignmentKind = "DISPATCHER_REVOCATION"; return changeStage("reassigned", "Assignment revoked · Delivery returned to Awaiting Courier"); }
          else if (action === "confirm_courier_withdrawal") { ui.reassignmentKind = "COURIER_WITHDRAWAL"; return changeStage("reassigned", "Courier Withdrawal recorded · On Duty is unchanged"); }

          }
          else if (action === "start_sharing_active") {
            var restartingState = buildState(currentStage());
            ui.sharingOverride = "REPORTING";
            if (restartingState.delivery.state === "ASSIGNED") return notify("Foreground Location Sharing restarted · Delivery remains Assigned");
            return changeStage("in_transit", "Foreground Location Sharing restarted");
          }
          else if (action === "interrupt_location") return changeStage("location_interrupted", "Reporting interrupted · Last Known Location is Delayed");
          else if (action === "recover_location") return changeStage("in_transit", "Reporting recovered with the newest fix only");
          else if (action === "confirm_delivered") return changeStage("delivered", "Handoff confirmed · Delivery is terminal");
          else if (action === "confirm_undeliverable") return changeStage("undeliverable", "Undeliverable recorded · a later attempt is a new Delivery");
          else if (action === "confirm_cancel_delivery") return changeStage("cancelled", "Delivery cancelled before pickup");
          render();
        }

        var stageSelect = document.getElementById("stage-select");
        Object.keys(scenarioSpecs).forEach(function (key) {
          var option = document.createElement("option");
          option.value = key;
          option.textContent = scenarioSpecs[key].label;
          stageSelect.appendChild(option);
        });
        document.getElementById("previous-variant").addEventListener("click", function () { cycleVariant(-1); });
        document.getElementById("next-variant").addEventListener("click", function () { cycleVariant(1); });
        document.getElementById("role-select").addEventListener("change", function (event) { setQuery({ role: event.target.value }); });
        stageSelect.addEventListener("change", function (event) { ui.onDutyOverride = null; ui.sharingOverride = null; ui.reassignmentKind = null; setQuery({ stage: event.target.value }); });
        document.getElementById("state-toggle").addEventListener("click", function () { ui.inspectorOpen = !ui.inspectorOpen; render(); });
        document.getElementById("state-close").addEventListener("click", function () { ui.inspectorOpen = false; render(); });
        document.addEventListener("click", function (event) {
          var actionElement = event.target.closest("[data-action]");
          if (actionElement) handleAction(actionElement.getAttribute("data-action"), actionElement);
        });
        window.addEventListener("keydown", function (event) {
          var target = event.target;
          var tag = target && target.tagName ? target.tagName.toLowerCase() : "";
          if (tag === "input" || tag === "textarea" || tag === "select" || (target && target.isContentEditable)) return;
          if (event.key === "ArrowLeft") cycleVariant(-1);
          if (event.key === "ArrowRight") cycleVariant(1);
          if (event.key === "Escape" && ui.panel) { ui.panel = null; render(); }
        });
        window.addEventListener("popstate", render);
        render();
      })();
    </script>
  </body>
</html>
