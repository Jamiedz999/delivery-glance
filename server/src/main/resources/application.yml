spring:
  application:
    name: delivery-glance
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/delivery_glance}
    username: ${SPRING_DATASOURCE_USERNAME:delivery_glance}
    password: ${SPRING_DATASOURCE_PASSWORD:delivery_glance}
  flyway:
    locations: classpath:db/migration
    validate-on-migrate: true
    # Fictional pre-provisioned demo accounts. Changing these only affects a database that has not
    # run V1 yet; an existing volume keeps the accounts it was created with.
    placeholders:
      demoDispatcherEmail: ${DEMO_DISPATCHER_EMAIL:dispatcher@delivery-glance.example}
      demoDispatcherDisplayName: ${DEMO_DISPATCHER_DISPLAY_NAME:Dana the Dispatcher}
      demoDispatcherPasswordHash: "${DEMO_DISPATCHER_PASSWORD_HASH:{bcrypt}$2a$12$48gmvbvPhSdBdq4T2Q90U.B8zYiNnEfN2sHG5LDmdCYkCbXboDQqK}"
      demoCourierEmail: ${DEMO_COURIER_EMAIL:courier@delivery-glance.example}
      demoCourierDisplayName: ${DEMO_COURIER_DISPLAY_NAME:Cory the Courier}
      demoCourierPasswordHash: "${DEMO_COURIER_PASSWORD_HASH:{bcrypt}$2a$12$bYalN1xoO/VQTnYbn6NEPuz3YTktkC.bMYNyKNVlEk9.ga5FfGhg.}"
  # Flyway owns every table, including Spring Session's, so no runtime DDL is allowed.
  sql:
    init:
      mode: never
  session:
    jdbc:
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: strict
        # The Compose demo serves plain HTTP on localhost; set this to true behind TLS.
        secure: ${SESSION_COOKIE_SECURE:false}

delivery-glance:
  tracking:
    # HMAC key material by version. Every Tracking Link is derived from one of these, so replacing a
    # key changes every link issued under it; add a new version and move current-key-version instead.
    # The default below is a fictional development value and is not a secret — set TRACKING_KEY_V1
    # to real key material before serving a link anyone outside the demo can open.
    keys:
      1: ${TRACKING_KEY_V1:development-only-tracking-key-do-not-deploy}
    current-key-version: ${TRACKING_CURRENT_KEY_VERSION:1}
    # Production default is secure; the plain-HTTP local Compose demo has to opt out explicitly.
    cookie-secure: ${TRACKING_COOKIE_SECURE:true}
    # The map style the tracking page loads, and the origin its Content-Security-Policy allows tiles
    # from. It is a release input: unset is a supported deployment, and the Recipient view then keeps
    # its status and freshness content and says the map is unavailable rather than failing the page.
    map-style-url: ${TRACKING_MAP_STYLE_URL:}
  recipient:
    # Who a Recipient is told to contact about a cancelled Delivery. One value for the whole Delivery
    # Team, never anything derived from the Delivery. Blank is supported; the page then points back
    # at whoever shared the link.
    delivery-team-contact: ${DELIVERY_TEAM_CONTACT:}
  proof:
    # Proof of delivery (Issue 50), the first feature to store binary artifacts. Off unless a bucket
    # is set: a blank bucket is a supported deployment, the /api/system probe reports it disabled and
    # the Courier is offered no capture. The application never streams a proof byte — it only signs
    # URLs — so it needs no S3 HTTP client, credentials or endpoint to sign against real AWS with an
    # instance role. The Compose `proof` profile points these at a LocalStack S3 instead, which is the
    # only way this feature runs without an AWS account.
    bucket: ${PROOF_BUCKET:}
    region: ${PROOF_REGION:us-east-1}
    # An S3 endpoint to sign against instead of the real AWS one. Blank in production; set to a
    # browser-reachable LocalStack address for the demo, paired with path-style access.
    endpoint-override: ${PROOF_ENDPOINT_OVERRIDE:}
    path-style-access: ${PROOF_PATH_STYLE_ACCESS:false}
    # Static credentials for signing. Blank in production, where the default provider chain (an
    # instance role) is used; any value works for LocalStack.
    access-key-id: ${PROOF_ACCESS_KEY_ID:}
    secret-access-key: ${PROOF_SECRET_ACCESS_KEY:}
    # How long an issued upload or view URL stays valid. Short by design.
    presign-expiry: ${PROOF_PRESIGN_EXPIRY:5m}
    max-upload-bytes: ${PROOF_MAX_UPLOAD_BYTES:10485760}
    # The shared secret the processing Lambda presents to POST /api/internal/proof-processed. Blank
    # disables the callback route, so a deployment without the Lambda cannot have proof metadata
    # written by anything but the Lambda it never configured.
    callback-token: ${PROOF_CALLBACK_TOKEN:}
  notification:
    # Off-band Recipient notification (Issue 51). Off unless a queue-url is set: a blank queue is a
    # supported deployment where transitions still write outbox rows for opted-in Recipients but
    # nothing relays or sends, and the opt-in endpoint reports the feature unavailable. The
    # application's only broker collaborator is SQS — the consumer Lambda does the SES/SNS send — so
    # only what makes the queue reachable, plus the callback secret, lives here. The Compose `notify`
    # profile points these at a LocalStack SQS, the only way the loop runs without an AWS account.
    queue-url: ${NOTIFY_QUEUE_URL:}
    region: ${NOTIFY_REGION:us-east-1}
    # An SQS endpoint to use instead of the real AWS one. Blank in production; a LocalStack address
    # for the demo and tests.
    endpoint-override: ${NOTIFY_ENDPOINT_OVERRIDE:}
    # Static credentials for the SQS client. Blank in production, where the default provider chain
    # (an instance role) is used; any value works for LocalStack.
    access-key-id: ${NOTIFY_ACCESS_KEY_ID:}
    secret-access-key: ${NOTIFY_SECRET_ACCESS_KEY:}
    # The most outbox rows one relay pass publishes, so a backlog drains over several ticks.
    relay-batch-size: ${NOTIFY_RELAY_BATCH_SIZE:50}
    # How often the relay looks for unpublished outbox rows. ISO-8601 duration.
    relay-interval: ${NOTIFY_RELAY_INTERVAL:PT5S}
    # The shared secret the consumer Lambda presents to the begin and sent callbacks. Blank disables
    # both routes, so a deployment without the Lambda cannot have a send recorded by anything but the
    # Lambda it never configured.
    callback-token: ${NOTIFY_CALLBACK_TOKEN:}
  demo:
    # POST /api/demo/reset, which empties every Delivery, Assignment, Tracking Link and Courier fact
    # and puts the fictional Deliveries back. Off unless a deployment says otherwise, and the
    # security policy reads this same value: with it off the route is refused rather than merely
    # unmapped. Turn it on only where every row is fictional and losing all of them is the point.
    reset-enabled: ${DEMO_RESET_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health
